{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="sec1">
    <form method="POST">
        {{ form.hidden_tag() }}
        <h1>Resend Code</h1>
        <label for="email">Email:</label>{{ form.email }}
        {{ form.submit }}
    </form><br>
    
    <label for="error">{{ error }}</label>
</div>
{% endblock %}
