{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
    <form method="POST">
        {{ form.hidden_tag() }}
        <h1>Register</h1>
        <label for="email">Email:</label>{{ form.email }}
        <label for="password">Password:</label>{{ form.password }}
        {{ form.submit }}
    </form>
{% endblock %}
