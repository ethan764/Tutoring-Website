<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <form method="POST">
        {{ form.hidden_tag() }}
        <h1>Register</h1>
        <label for="email">Email:</label>{{ form.email }}
        <label for="password">Password:</label>{{ form.password }}
        {{ form.submit }}
    </form>
</body>
</html>
