{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
    <form method="POST", action="">
        {{ form.hidden_tag() }}
        <h1>Login</h1>
        <label for="email">Email:</label>{{ form.email }}
        <label for="password">Password:</label>{{ form.password }}
        {{ form.submit }}
    </form>
    <label for="error">{{ error }}</label>
    <a href="{{ url_for('auth.register') }}">First time? Register</a>
</body>
{% endblock %}
